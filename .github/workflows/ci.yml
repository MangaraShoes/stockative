on: [push, pull_request]

name: CI

jobs:
  CI:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    env:
      # Prisma exige que DATABASE_URL/DIRECT_URL resolvam pra algo (ver
      # prisma/schema.prisma) mesmo pra `prisma validate`/`generate`, que só
      # leem o schema e nunca abrem conexão de verdade — não é segredo, é
      # só pra satisfazer o env(). Nunca aponta pro banco real de produção.
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci?sslmode=disable"
      DIRECT_URL: "postgresql://user:password@localhost:5432/ci?sslmode=disable"
    strategy:
      matrix:
        # Só npm: é o único gerenciador que este projeto suporta (só existe
        # package-lock.json, sem yarn.lock/pnpm-lock.yaml). Testar yarn/pnpm
        # aqui era resíduo do template genérico da Shopify e falhava sempre,
        # porque a resolução de node_modules deles diverge da do npm.
        node: [20.19.0, 22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'javascript') }}
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Validate Prisma
        run: npx prisma generate && npx prisma validate

      - name: Build application
        run: npm run build
