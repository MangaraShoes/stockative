name: Stockative scheduled jobs

# Dispara os 3 endpoints /cron/* do app (ver app/routes/cron.*.tsx) — eles
# não rodam sozinhos, precisam de algo externo batendo neles periodicamente.
# GitHub Actions só faz a chamada HTTP; o app em si precisa estar publicado
# num host com URL fixa e rodando o tempo todo (não funciona contra um túnel
# ngrok, que muda de endereço e cai quando o terminal fecha).
#
# Requer 2 secrets no repositório (Settings → Secrets and variables →
# Actions → New repository secret):
#   STOCKATIVE_APP_URL    — ex.: https://stockative.onrender.com (sem barra no fim)
#   STOCKATIVE_CRON_SECRET — o mesmo valor da env var CRON_SECRET no host do app
on:
  schedule:
    # Publica posts agendados que já venceram — checagem frequente, pra sair
    # perto do horário real (mesmo padrão dos outros 2 crons).
    #
    # Deslocado de "*/15 * * * *" (Patricia, 19/09/2026): minutos redondos
    # (:00/:15/:30/:45) concorrem com todo o GitHub e sofrem atraso/descarte
    # sob carga — o primeiro disparo depois de criar este workflow rodou às
    # 16:08 e o slot de */15 seguinte simplesmente não apareceu. Minuto
    # deslocado reduz a chance de cair numa fila cheia.
    - cron: "8,23,38,53 * * * *"
    # Gera o próximo plano semanal pra loja que passou do intervalo de 7 dias.
    - cron: "22 6 * * *"
    # Coleta likes/comments dos posts publicados — fecha o loop de medição
    # (Patricia, 13/09/2026, ver collectDuePerformanceSignals).
    - cron: "7 6 * * *"
  workflow_dispatch: {} # permite rodar manualmente na aba Actions, pra testar

jobs:
  publish-scheduled:
    if: github.event.schedule == '8,23,38,53 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/publish-scheduled
        run: |
          curl -fsS -X POST "${{ secrets.STOCKATIVE_APP_URL }}/cron/publish-scheduled" \
            -H "Authorization: Bearer ${{ secrets.STOCKATIVE_CRON_SECRET }}"

  generate-weekly-plans:
    if: github.event.schedule == '22 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Diferente dos outros 2 endpoints, este chama a IA de verdade (copy +
      # imagem) por post gerado — pra uma loja com plano pendente isso passa
      # dos ~5min que o proxy do Railway aguenta numa request, e ele devolve
      # 502 pro cliente mesmo com o trabalho terminando certinho no servidor
      # (confirmado em produção em 20/09/2026: lastWeeklyPlanGeneratedAt e os
      # content_items novos ficaram lá mesmo com o curl caindo em 502). Então
      # 502/504 aqui não é tratado como falha — só um 401/500 genuíno é.
      - name: Call /cron/generate-weekly-plans
        run: |
          status=$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time 600 \
            -X POST "${{ secrets.STOCKATIVE_APP_URL }}/cron/generate-weekly-plans" \
            -H "Authorization: Bearer ${{ secrets.STOCKATIVE_CRON_SECRET }}")
          cat /tmp/response.json
          echo
          echo "HTTP status: $status"
          if [ "$status" = "502" ] || [ "$status" = "504" ]; then
            echo "::warning::Gateway timeout waiting for the response — generation keeps running server-side and finishes on its own, so this isn't treated as a job failure."
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

  collect-performance:
    if: github.event.schedule == '7 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call /cron/collect-performance
        run: |
          curl -fsS -X POST "${{ secrets.STOCKATIVE_APP_URL }}/cron/collect-performance" \
            -H "Authorization: Bearer ${{ secrets.STOCKATIVE_CRON_SECRET }}"
