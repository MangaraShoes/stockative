name: Deploy (Hetzner)

# Substitui o deploy automático do Railway (ver HETZNER.md): a cada push no
# main, entra no servidor por SSH, atualiza o código e reconstrói o app.
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   HETZNER_HOST     — IP do servidor
#   HETZNER_SSH_KEY  — chave privada do deploy (a pública fica em
#                      /root/.ssh/authorized_keys no servidor)
# Sem esses secrets o job não faz nada, então pode existir antes da migração.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "HETZNER_HOST not set, skipping deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@"$HOST" bash -s <<'EOF'
            set -euo pipefail
            cd /opt/stockative
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            COMPOSE="docker compose -f deploy/hetzner/docker-compose.yml"
            PROFILES=""
            [ -f .env.public ] && PROFILES="--profile public"
            $COMPOSE $PROFILES up -d --build --remove-orphans
            # O Caddy não relê o Caddyfile sozinho e o `up` não recria o
            # container quando só o arquivo muda (27/10/2026: o bloco
            # apps.stockative.com ficou de fora). Recria quando o hash difere
            # do último aplicado, guardado fora do git.
            CADDY_HASH=$(sha256sum deploy/hetzner/Caddyfile | cut -d' ' -f1)
            if [ "$CADDY_HASH" != "$(cat .caddyfile.applied 2>/dev/null)" ]; then
              $COMPOSE up -d --force-recreate --no-deps caddy
              echo "$CADDY_HASH" > .caddyfile.applied
            fi
            $COMPOSE ps
          EOF
