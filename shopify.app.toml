# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f1978fb0820d62282071fdd8bea58214"
application_url = "https://app.stockative.com"
embedded = true
name = "Stockative"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_locales: idioma primário/secundário real da loja (shopLocales), pra
# pré-preencher o idioma de publicação no onboarding em vez de assumir
# inglês (Patricia, 13/09/2026: "precisa sempre ter a permissao do idioma é
# muito importante" — descoberto quando faltar essa permissão derrubou o
# app inteiro na Mangará).
scopes = "read_products,write_products,read_orders,read_locales"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/create"
  topics = [ "products/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

[auth]
redirect_urls = [ "https://app.stockative.com/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
